name: Setup Go
description: "Sets up Go environment"
inputs:
  go-version:
    required: false
    description: version or version range of Go to use
  cache-dependency-path:
    required: false
    description: path to dependency files for caching
  go-repo-read-token:
    required: false
    description: token with read access to the private Go SDK staging repo
runs:
  using: composite
  steps:
    - name: Authenticate git for the private Go SDK repo
      if: github.repository == 'stainless-sdks/stigg-cli-staging' && inputs.go-repo-read-token != ''
      shell: bash
      # actions/checkout persists this repo's GITHUB_TOKEN as an extraheader
      # in the local git config, which outranks the URL credential below for
      # commands run inside the workspace; reset it for the go-staging URL
      # only (most-specific http.<url>.* config wins).
      run: |
        git config --global url."https://x-access-token:${{ inputs.go-repo-read-token }}@github.com/stainless-sdks/stigg-go-staging".insteadOf "https://github.com/stainless-sdks/stigg-go-staging"
        git config --global http."https://github.com/stainless-sdks/stigg-go-staging".extraheader ""

    - name: Verify Go SDK module is accessible
      shell: bash
      env:
        GO_MODULE_REPO: ${{ github.repository == 'stiggio/stigg-cli-staging' && 'stiggio/stigg-go-staging' || 'stiggio/stigg-go' }}
      run: |
        if ! git ls-remote --exit-code "https://github.com/${GO_MODULE_REPO}" >/dev/null 2>&1; then
          echo "::error::Cannot access the Go SDK module at https://github.com/${GO_MODULE_REPO}."
          echo "::error::If the repo is private, uncomment the 'Authenticate git for the private Go SDK repo' step in .github/workflows/ci.yml and add a GO_REPO_READ_TOKEN secret to this repo."
          exit 1
        fi

    - name: Setup go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ./go.mod
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Bootstrap
      shell: bash
      run: ./scripts/bootstrap
